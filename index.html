<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ead8a2">
<title>Legal Pad — Mis notas</title>
<style>
:root{--paper:#f7f0df;--paper-ink:#27211a;--line:#9bc8df;--accent:#da5a56;--muted:#6a5a48;--shadow:rgba(30,17,8,.28)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:Arial,Helvetica,sans-serif;color:var(--paper-ink);background:linear-gradient(rgba(41,24,11,.18), rgba(41,24,11,.18)),url('assets/desk-wood.jpg') center center / cover no-repeat fixed}
button,input,textarea{font:inherit}
button{cursor:pointer;padding:9px 12px;border:2px solid rgba(43,28,17,.65);background:#fff8df;border-radius:8px;color:#2e261f;box-shadow:0 2px 6px rgba(0,0,0,.08);font-weight:700}
button:hover{filter:brightness(1.03)}button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6a91b0;outline-offset:2px}
.top{max-width:1120px;margin:0 auto;padding:18px 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff7e8;text-shadow:0 2px 4px rgba(0,0,0,.35)}.small{font-size:12px;color:#f2e7d1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.topright{display:flex;align-items:center;gap:9px}.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding:0 14px 24px}
.sidebar{border:0;background:transparent;border-radius:0;padding:6px 0 0;align-self:start;box-shadow:none}.sidebarhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;padding:0 4px}.sidebarhead strong{font-size:14px;color:#fff7e8;text-shadow:0 1px 2px rgba(0,0,0,.35)}.notelist{display:grid;gap:12px}
.noteitem{position:relative;width:100%;min-height:76px;text-align:left;padding:26px 16px 14px 18px;border:0;border-radius:4px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;background:transparent;color:#30261e;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.noteitem::before{content:"";position:absolute;inset:0;background:url('assets/strip-ruled.png') center/100% 100% no-repeat;z-index:-1;filter:drop-shadow(0 5px 10px rgba(0,0,0,.16))}
.noteitem::after{content:"";position:absolute;width:56px;height:20px;top:-7px;left:12px;background:url('assets/tape-kraft.png') center/contain no-repeat;opacity:.92;transform:rotate(-7deg)}
.noteitem:nth-child(even)::before{background-image:url('assets/strip-yellow.png')}.noteitem.active{transform:translateY(-1px)}.noteitem.active::before{filter:drop-shadow(0 9px 16px rgba(0,0,0,.2)) saturate(1.04)}.noteitem:hover{transform:translateY(-2px)}
.pad{position:relative;min-height:calc(100dvh - 145px);background:var(--paper);border-radius:6px;box-shadow:0 18px 32px var(--shadow), 0 2px 6px rgba(0,0,0,.12);overflow:hidden}
.pad:before{content:"";height:18px;background:var(--accent);position:absolute;inset:0 0 auto;z-index:3;box-shadow:0 2px 0 rgba(126,33,30,.18)}.pad:after{content:"";position:absolute;top:18px;bottom:0;left:clamp(48px,9%,78px);width:2px;background:#d97a74;opacity:.78;pointer-events:none;z-index:2}
.paper-surface{position:absolute;inset:18px 0 0;background:url('assets/paper-ruled.webp') top center/cover no-repeat;pointer-events:none;opacity:.9;z-index:0}.lines{position:absolute;inset:18px 0 0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 32px,rgba(155,200,223,.52) 33px,rgba(155,200,223,.52) 34px);background-position:0 48px;pointer-events:none;z-index:1;mix-blend-mode:multiply}
.heading{position:relative;z-index:4;padding:34px 22px 0 clamp(68px,12%,104px);display:flex;gap:8px;align-items:flex-start}.heading input{width:100%;border:0;background:transparent;font-size:24px;font-weight:800;min-width:0;outline:none;color:#2d241d}.heading input::placeholder,textarea::placeholder{color:#8c7b66}.heading button{white-space:nowrap;padding:6px 9px;background:#fff8df}
.toc{position:relative;z-index:4;margin:16px 22px 0 clamp(68px,12%,104px);padding:10px 0;border-bottom:1px solid rgba(149,128,92,.35);display:flex;flex-wrap:wrap;align-items:center;gap:7px 9px}.toc:empty{display:none}.toc-label{font-size:12px;font-weight:800;color:#6f583d;margin-right:3px;letter-spacing:.04em}.toc a{font-size:13px;color:#483521;text-decoration:none;border:1px solid rgba(124,93,54,.42);padding:6px 10px;background:rgba(255,248,225,.92);border-radius:999px;overflow-wrap:anywhere;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.05)}.toc a:hover{text-decoration:underline}
.hintedit{position:relative;z-index:4;margin:8px 22px 0 clamp(68px,12%,104px);font-size:12px;color:#6e604d}.insertheading{font-size:12px;padding:5px 9px}
.backtop{position:fixed;z-index:10;right:22px;bottom:24px;border-radius:999px;background:#fff8df;color:#392e25;border:2px solid rgba(43,28,17,.65);box-shadow:0 6px 18px rgba(0,0,0,.18);padding:12px 15px;font-weight:bold}.backtop:hover{background:#fffdf2}
.pad textarea{position:relative;z-index:4;display:block;width:100%;min-height:101vh;height:auto;overflow:hidden;resize:none;padding:16px 22px 55px clamp(68px,12%,104px);border:0;background:transparent;outline:0;font-size:17px;line-height:34px;color:#33271f}
.foot{max-width:1120px;margin:0 auto;padding:0 16px 18px;color:#f3ead7;font-size:12px;display:flex;justify-content:space-between;gap:12px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.login{max-width:500px;margin:8vh auto;padding:34px 28px;text-align:center;background:url('assets/strip-yellow.png') center/100% 100% no-repeat;min-height:300px;display:flex;flex-direction:column;justify-content:center;filter:drop-shadow(0 18px 20px rgba(0,0,0,.18));position:relative}.login::before{content:"";position:absolute;width:92px;height:30px;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);background:url('assets/tape-kraft.png') center/contain no-repeat;opacity:.95}.login p{line-height:1.6}.login button{margin-top:12px;font-weight:bold;align-self:center}.hint{font-size:13px;color:#6b6556}.hidden{display:none!important}
@media(max-width:690px){.app{display:block}.sidebar{margin-bottom:14px}.notelist{display:flex;overflow:auto;gap:10px;padding-bottom:4px}.noteitem{min-width:140px;max-width:180px}.pad{min-height:60vh}.pad textarea{min-height:101vh}.backtop{right:10px;bottom:12px}.heading input{font-size:20px}.topright .small{display:none}.top{padding:12px}.foot{font-size:11px;display:block}.login{background-size:100% 100%;margin:5vh 12px}}
@media print{body{background:#fff}.top,.sidebar,.foot,.heading button,.hintedit,.toc,.backtop{display:none}.app{display:block;padding:0}.pad{box-shadow:none;min-height:100vh}.paper-surface{display:none}}

/* Post-it sidebar and solid controls — existing repository assets only */
:root{--hand:"Segoe Print","Comic Sans MS","Bradley Hand",cursive}
.topright button,#newnote,.heading button,.insertheading,.backtop,#signin{
  appearance:none;background:#ffedb0!important;border:2px solid #42301f!important;
  color:#2b2119!important;opacity:1!important;
  box-shadow:2px 3px 0 #4d3723,0 5px 12px #150d0745!important;
  text-shadow:none!important;font-family:var(--hand);font-weight:800;
}
.topright button{background:#fbe4be!important}
#newnote{background:#b6e3f4!important;padding:8px 12px}
#delete{background:#f8c5b7!important}
#download{background:#ffdf83!important}
.insertheading{background:#b6e3f4!important}
.backtop{background:#ffe08a!important}
.topright button:hover,#newnote:hover,.heading button:hover,.insertheading:hover,.backtop:hover{filter:brightness(1.06)}
.sidebar{
  position:relative;isolation:isolate;
  background:#f7dc69 url('assets/strip-yellow.png') center center / 100% 100% no-repeat;
  min-height:230px;padding:30px 14px 24px;
  border:0;border-radius:5px 7px 6px 5px;
  box-shadow:3px 5px 0 #4d331d54,0 14px 26px #170c0860;
  transform:rotate(-1deg);overflow:visible;
}
.sidebar:before{
  content:"";position:absolute;top:-13px;left:35%;width:78px;height:33px;z-index:5;
  background:url('assets/tape-kraft.png') center / contain no-repeat;
  transform:rotate(-8deg);pointer-events:none;
}
.sidebarhead{
  position:relative;z-index:2;border-bottom:2px dashed #7b5b3473;
  padding:0 2px 13px;margin:0 0 14px;align-items:center;
}
.sidebarhead strong{
  font-family:var(--hand);font-size:20px;font-weight:900;
  color:#46301c;text-shadow:none;letter-spacing:-.035em;
}
.notelist{position:relative;z-index:2;gap:9px}
.noteitem{
  position:relative;isolation:isolate;overflow:visible;
  min-height:63px;padding:16px 12px;text-align:left;
  font-family:var(--hand);font-size:15px;font-weight:800;
  color:#30241b!important;background:#fff8df url('assets/strip-ruled.png') center/100% 100% no-repeat!important;
  border:0!important;border-radius:3px;box-shadow:0 4px 9px #472c1a26!important;
  white-space:nowrap;text-overflow:ellipsis;
}
.noteitem:before{content:none!important}
.noteitem:after{
  content:"";position:absolute;top:-12px;left:10px;width:53px;height:23px;
  background:url('assets/tape-kraft.png') center/contain no-repeat;
  transform:rotate(-10deg);pointer-events:none;
}
.noteitem:nth-child(even){background-image:url('assets/strip-yellow.png')!important}
.noteitem.active{outline:2px solid #734b22;outline-offset:0;transform:rotate(.4deg)}
.noteitem:hover{transform:translateY(-2px);filter:brightness(1.015)}
@media(max-width:690px){
 .sidebar{min-height:0;padding:27px 12px 16px;transform:none}
 .sidebarhead{margin-bottom:12px}
 .notelist{gap:10px;padding-top:8px}
 .noteitem{min-width:140px;max-width:180px;min-height:65px}
}
@media print{.sidebar{display:none}}

/* Mobile reliability and layout refinements */
html{overflow-x:hidden}
body{min-width:0;overflow-x:hidden}
.app,.pad,.sidebar,.top,.topright,.heading{min-width:0}
.sidebar{z-index:1}
.noteitem{z-index:0}
.noteitem::after{z-index:2}
@media(max-width:690px){
 body{background-attachment:scroll;background-size:cover}
 .top{width:100%;padding:14px 12px 12px;gap:8px;align-items:center}
 .brand{font-size:17px;min-width:0}
 .topright{gap:5px;flex-shrink:0}
 #signout{font-size:12px;padding:8px 9px;white-space:nowrap}
 .app{width:100%;display:block;padding:0 10px 16px}
 .sidebar{width:100%;min-height:0;padding:26px 15px 18px;margin:0 0 19px;transform:none}
 .sidebarhead{flex-wrap:wrap;gap:8px}
 .sidebarhead strong{font-size:19px}
 #newnote{font-size:13px}
 .notelist{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:visible;gap:10px;padding:14px 4px 12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
 .noteitem{flex:0 0 144px;max-width:170px;min-height:72px;white-space:normal;overflow-wrap:anywhere;font-size:13px;line-height:1.3;padding:24px 10px 11px}
 .noteitem::after{top:-8px}
 .pad{width:100%;min-width:0;overflow:hidden}
 .heading{padding:32px 12px 0 clamp(52px,13%,72px);gap:5px;flex-wrap:wrap}
 .heading input{font-size:20px;flex:1 1 100%;min-width:0}
 .heading button{font-size:12px;padding:7px 10px}
 .toc{margin:12px 12px 0 clamp(52px,13%,72px);gap:7px}
 .toc a{font-size:12px;overflow-wrap:anywhere}
 .hintedit{margin:12px 12px 0 clamp(52px,13%,72px);line-height:1.6}
 .pad textarea{padding:14px 12px 55px clamp(52px,13%,72px);font-size:16px;line-height:34px;min-height:101dvh;overflow:hidden;resize:none}
 .foot{padding:0 14px 20px;line-height:1.5}
 .backtop{right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:11px 13px}
 .login{width:calc(100% - 28px);max-width:460px;margin:8vh auto;min-height:270px;padding:44px 26px;background-size:100% 100%}
}
@media(max-width:390px){
 .brand{font-size:15px}
 #signout{font-size:11px;padding:7px 8px}
 .heading input{font-size:19px}
 .noteitem{flex-basis:132px}
}
</style>
</head>
<body>
<section id="login">
  <h1>Legal Pad</h1>
  <p>Tu bloc de notas, privado y sincronizado entre dispositivos.</p>
  <button id="signin" type="button">Entrar con Google</button>
  <p id="loginmsg">Tus notas se guardarán en tu propia cuenta.</p>
</section>

<div id="workspace" class="hidden">
  <header class="top">
    <div class="brand">Legal Pad <span class="small">/ Mis notas</span></div>
    <div class="topright"><span id="userlabel" class="small"></span><button id="signout" type="button">Cerrar sesión</button></div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebarhead"><strong>Mis notas</strong><button id="newnote" type="button">+ Nueva</button></div>
      <nav id="notelist" class="notelist" aria-label="Lista de notas"></nav>
    </aside>

    <main class="pad">
      <div class="paper-texture"></div>
      <div class="lines"></div>
      <div class="frame-overlay"></div>
      <div class="tape tape-left"></div>
      <div class="tape tape-right"></div>
      <div class="heading">
        <input id="title" maxlength="120" aria-label="Título" placeholder="Sin título">
        <button id="download" type="button" title="Exportar texto">TXT</button>
        <button id="delete" type="button" title="Eliminar nota">Eliminar</button>
      </div>
      <nav id="toc" class="toc" aria-label="Índice de la nota"></nav>
      <div class="hintedit"><button id="insertheading" class="insertheading" type="button">+ Encabezado H1</button> o escribe <code># Título</code> al inicio de una línea.</div>
      <textarea id="body" aria-label="Contenido de la nota" placeholder="Empieza a escribir aquí..." spellcheck="true"></textarea>
    </main>
  </div>

  <footer class="foot"><span id="status" role="status">Conectando…</span><span>Sincronización mediante Firebase</span></footer>
</div>

<button id="backtop" class="backtop hidden" type="button" aria-label="Volver arriba">↑ Arriba</button>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const $ = id => document.getElementById(id);
const login = $('login'), workspace = $('workspace'), statusEl = $('status');
const titleEl = $('title'), bodyEl = $('body'), tocEl = $('toc');
const ready = !!firebaseConfig.apiKey;
let auth, db, user = null, notes = [], selected = null, unsubscribe = null, timer = null, dirty = false, saveQueue = Promise.resolve(), writing = false;

function resizePage(){
  bodyEl.style.height = 'auto';
  bodyEl.style.height = Math.max(window.innerHeight * 1.01, bodyEl.scrollHeight + 2) + 'px';
}
function parseHeadings(){
  const items=[]; let offset=0;
  for(const line of bodyEl.value.split('\n')){
    const m=/^#\s+(.+?)\s*$/.exec(line);
    if(m) items.push({name:m[1], index:offset});
    offset += line.length + 1;
  }
  return items;
}
function jumpTo(index){
  const before = bodyEl.value.slice(0,index);
  const measure = document.createElement('div');
  const cs = getComputedStyle(bodyEl);
  Object.assign(measure.style, {
    position:'absolute', visibility:'hidden', left:'-99999px', top:'0', width:cs.width, boxSizing:'border-box',
    padding:cs.padding, font:cs.font, lineHeight:cs.lineHeight, whiteSpace:'pre-wrap', overflowWrap:'break-word', wordBreak:'break-word'
  });
  measure.textContent = before + '\u200b';
  document.body.append(measure);
  const y = measure.getBoundingClientRect().height - parseFloat(cs.paddingBottom) - parseFloat(cs.lineHeight);
  measure.remove();
  const top = window.scrollY + bodyEl.getBoundingClientRect().top + Math.max(0, y) - 20;
  window.scrollTo({top, behavior:'smooth'});
}
function renderTOC(){
  tocEl.replaceChildren();
  const items = parseHeadings();
  if(!items.length){ resizePage(); return; }
  const label = document.createElement('span');
  label.className = 'toc-label';
  label.textContent = 'ÍNDICE';
  tocEl.append(label);
  items.forEach((item,i)=>{
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = item.name;
    a.addEventListener('click', ev => { ev.preventDefault(); jumpTo(item.index); });
    tocEl.append(a);
  });
  resizePage();
}
function toggleTop(){ $('backtop').classList.toggle('hidden', !user || window.scrollY < 260); }

function renderList(){
  const box = $('notelist');
  box.replaceChildren();
  for(const note of notes){
    const btn = document.createElement('button');
    btn.className = 'noteitem' + (selected === note.id ? ' active' : '');
    btn.textContent = (note.title || '').trim() || 'Sin título';
    btn.type = 'button';
    btn.onclick = () => choose(note.id);
    box.append(btn);
  }
}
function populate(){
  const n = notes.find(x => x.id === selected);
  titleEl.value = n?.title || '';
  bodyEl.value = n?.body || '';
  renderTOC();
  renderList();
}
async function persist(){
  clearTimeout(timer);
  if(!dirty || !selected || !user) return;
  const uid = user.uid, id = selected;
  const payload = { title: titleEl.value, body: bodyEl.value, updatedAt: serverTimestamp() };
  dirty = false;
  statusEl.textContent = 'Guardando…';
  saveQueue = saveQueue.catch(()=>{}).then(()=>setDoc(doc(db,'users',uid,'notes',id), payload, {merge:true}));
  try {
    await saveQueue;
    statusEl.textContent = dirty ? 'Cambios pendientes…' : 'Guardado en la nube';
  } catch (e) {
    dirty = true;
    statusEl.textContent = 'Error al guardar: ' + e.message;
  }
}
function changed(){
  if(!user || !selected) return;
  dirty = true;
  writing = true;
  statusEl.textContent = 'Cambios pendientes…';
  const current = notes.find(x => x.id === selected);
  if(current) current.title = titleEl.value;
  clearTimeout(timer);
  timer = setTimeout(() => { writing = false; persist(); }, 900);
  renderList();
  renderTOC();
}
async function choose(id){
  if(id === selected) return;
  await persist();
  selected = id;
  populate();
}

if(!ready){
  $('signin').disabled = true;
  $('loginmsg').textContent = 'Falta conectar Firebase.';
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app); db = getFirestore(app);
  // GitHub Pages is a different origin from firebaseapp.com. Redirect
  // authentication can fail on modern Android browsers with storage partitioning.
  // Use a direct, user-initiated popup and make failures actionable.
  const signinButton = $('signin');
  const loginMessage = $('loginmsg');
  signinButton.onclick = async () => {
    signinButton.disabled = true;
    loginMessage.textContent = 'Abriendo acceso de Google…';
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
      loginMessage.textContent = 'Sesión iniciada.';
    } catch(e) {
      const code = e?.code || '';
      if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
        loginMessage.textContent = 'Inicio de sesión cancelado. Pulsa «Entrar con Google» para intentarlo de nuevo.';
      } else if(code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') {
        loginMessage.textContent = 'Este navegador bloqueó el acceso. Abre Legal Pad directamente en Google Chrome (no en el navegador interno de otra aplicación) y permite ventanas emergentes.';
      } else if(code === 'auth/unauthorized-domain') {
        loginMessage.textContent = 'Dominio no autorizado en Firebase. Agrega gabect.github.io en Authentication → Settings → Authorized domains.';
      } else if(code === 'auth/network-request-failed') {
        loginMessage.textContent = 'Error de red al conectar con Google. Comprueba la conexión e inténtalo otra vez.';
      } else {
        loginMessage.textContent = 'Error de Google (' + (code || 'desconocido') + '). ' + (e?.message || 'Inténtalo desde Chrome.');
      }
      console.error('Legal Pad Google sign-in',code,e);
    } finally {
      signinButton.disabled = false;
    }
  };
  onAuthStateChanged(auth, u => {
    if(unsubscribe){ unsubscribe(); unsubscribe = null; }
    user = u; notes = []; selected = null; dirty = false; clearTimeout(timer);
    titleEl.value = ''; bodyEl.value = ''; renderTOC(); renderList(); toggleTop();
    login.classList.toggle('hidden', !!u); workspace.classList.toggle('hidden', !u);
    if(!u) return;
    $('userlabel').textContent = u.displayName || u.email || '';
    statusEl.textContent = 'Sincronizando…';
    const col = collection(db, 'users', u.uid, 'notes');
    unsubscribe = onSnapshot(col, snap => {
      notes = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(b.updatedAt?.toMillis?.()||0) - (a.updatedAt?.toMillis?.()||0));
      if(selected && !notes.some(n => n.id === selected)){ selected = null; titleEl.value = ''; bodyEl.value = ''; }
      if(!selected && notes.length) selected = notes[0].id;
      if(selected && !writing) populate(); else renderList();
      statusEl.textContent = 'Sincronizado';
    }, e => statusEl.textContent = 'Error de sincronización: ' + e.message);
  });
}

titleEl.addEventListener('input', changed);
bodyEl.addEventListener('input', changed);
$('insertheading').onclick = () => {
  if(!selected) return;
  const start = bodyEl.selectionStart, end = bodyEl.selectionEnd;
  const text = bodyEl.value;
  const lineStart = text.lastIndexOf('\n', start - 1) + 1;
  const prefix = lineStart === start ? '' : (start === 0 ? '' : '\n');
  const insert = prefix + '# Nuevo encabezado\n';
  bodyEl.setRangeText(insert, start, end, 'end');
  bodyEl.focus();
  changed();
};
$('newnote').onclick = async () => {
  if(!user) return;
  await persist();
  try {
    const d = await addDoc(collection(db, 'users', user.uid, 'notes'), { title:'', body:'', updatedAt: serverTimestamp() });
    selected = d.id; titleEl.value = ''; bodyEl.value = ''; renderTOC(); renderList(); bodyEl.focus(); statusEl.textContent = 'Nota creada';
  } catch(e){ statusEl.textContent = 'Error al crear: ' + e.message; }
};
$('delete').onclick = async () => {
  if(!user || !selected || !confirm('¿Eliminar la nota de todos los dispositivos?')) return;
  await persist();
  const id = selected;
  try {
    await deleteDoc(doc(db, 'users', user.uid, 'notes', id));
    selected = null; titleEl.value = ''; bodyEl.value = ''; renderTOC(); statusEl.textContent = 'Nota eliminada';
  } catch(e){ statusEl.textContent = 'Error al eliminar: ' + e.message; }
};
$('download').onclick = () => {
  const name = (titleEl.value.trim() || 'mi-nota').replace(/[\\/:*?"<>|]/g,'').slice(0,70) || 'mi-nota';
  const content = (titleEl.value.trim() ? titleEl.value.trim() + '\n\n' : '') + bodyEl.value;
  const url = URL.createObjectURL(new Blob([content], {type:'text/plain;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = name + '.txt'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$('signout').onclick = async () => { await persist(); await signOut(auth); };
$('backtop').onclick = () => window.scrollTo({top:0, behavior:'smooth'});
window.addEventListener('resize', resizePage);
window.addEventListener('scroll', toggleTop, {passive:true});
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') persist(); });
resizePage();
</script>
</body>
</html>
