<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff2b4"><title>Legal Pad</title>
<style>
:root{--paper:#fff4b8;--line:rgba(67,117,176,.23);--red:#c4403a;--ink:#33312c}*{box-sizing:border-box}
body{margin:0;background:#e9e6dc;font:16px Arial,sans-serif;color:var(--ink)}
button,input,textarea{font:inherit}button{cursor:pointer;padding:9px 12px;border:1px solid #d1cbbc;background:#fffdf7;border-radius:6px;color:#3d3a33}button:hover{background:white}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #6a91b0}
.top{max-width:1100px;margin:auto;padding:15px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:18px;font-weight:750}.small{font-size:12px;color:#69685f}
.topright{display:flex;align-items:center;gap:9px}.app{max-width:1100px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;padding:0 12px 20px}
.sidebar{border:1px solid #d1caba;background:#f8f6ee;border-radius:7px;padding:12px;align-self:start}.sidebarhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.sidebarhead strong{font-size:14px}.notelist{display:grid;gap:5px}.noteitem{width:100%;text-align:left;padding:10px;background:transparent;border:0;border-radius:5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.noteitem.active{background:#eadca9}.noteitem:hover{background:#eee8d5}
.pad{position:relative;min-height:calc(100dvh - 145px);background:var(--paper);border-radius:2px;box-shadow:0 12px 32px #514a3025;overflow:hidden}
.pad:before{content:"";height:17px;background:var(--red);position:absolute;inset:0 0 auto;z-index:3}.pad:after{content:"";position:absolute;top:17px;bottom:0;left:clamp(43px,9%,72px);width:2px;background:#cf635f;opacity:.8;pointer-events:none}
.lines{position:absolute;inset:17px 0 0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 32px,var(--line) 33px,var(--line) 34px);background-position:0 50px;pointer-events:none}
.heading{position:relative;padding:32px 22px 0 clamp(62px,12%,99px);display:flex;gap:8px}.heading input{width:100%;border:0;background:transparent;font-size:22px;font-weight:bold;min-width:0;outline:none}.heading button{white-space:nowrap;padding:5px 8px}
.toc{position:relative;margin:16px 22px 0 clamp(62px,12%,99px);padding:9px 0;border-bottom:1px solid #beaa71;display:flex;flex-wrap:wrap;align-items:center;gap:7px 9px}
.toc:empty{display:none}.toc-label{font-size:12px;font-weight:bold;color:#7f5944;margin-right:3px}.toc a{font-size:13px;color:#744333;text-decoration:none;border:1px solid #c9b47e;padding:5px 9px;background:#fff7d4;border-radius:4px;overflow-wrap:anywhere;max-width:100%}.toc a:hover{text-decoration:underline}
.hintedit{position:relative;margin:8px 22px 0 clamp(62px,12%,99px);font-size:12px;color:#796c4c}.insertheading{font-size:12px;padding:5px 9px}
.backtop{position:fixed;z-index:10;right:22px;bottom:24px;border-radius:999px;background:#b8453e;color:white;border:0;box-shadow:0 3px 12px #0004;padding:12px 15px;font-weight:bold}.backtop:hover{background:#96342e}
.pad textarea{position:relative;display:block;width:100%;min-height:calc(100dvh - 255px);height:auto;overflow:hidden;resize:none;padding:16px 22px 55px clamp(62px,12%,99px);border:0;resize:vertical;background:transparent;outline:0;font-size:17px;line-height:34px;color:var(--ink)}
.foot{max-width:1100px;margin:auto;padding:0 14px 15px;color:#706f63;font-size:12px;display:flex;justify-content:space-between;gap:12px}
.login{max-width:470px;margin:10vh auto;padding:34px 25px;text-align:center;background:var(--paper);border-top:16px solid var(--red);box-shadow:0 12px 35px #514a3025}.login p{line-height:1.6}.login button{margin-top:12px;font-weight:bold}.hint{font-size:13px;color:#6b6556}.hidden{display:none!important}
@media(max-width:690px){.app{display:block}.sidebar{margin-bottom:10px}.notelist{display:flex;overflow:auto;gap:4px}.noteitem{min-width:115px;max-width:170px}.pad{min-height:60vh}.pad textarea{min-height:55vh}.backtop{right:10px;bottom:12px}.heading input{font-size:19px}.topright .small{display:none}.top{padding:10px}}
@media print{body{background:white}.top,.sidebar,.foot,.heading button,.hintedit,.toc,.backtop{display:none}.app{display:block;padding:0}.pad{box-shadow:none;min-height:100vh}}
</style></head><body>
<section id="login" class="login"><h1>Legal Pad</h1><p>Tu bloc amarillo, privado y sincronizado.</p><button id="signin">Entrar con Google</button><p id="loginmsg" class="hint">Tus notas estarán en tu propia cuenta.</p></section>
<div id="workspace" class="hidden"><header class="top"><strong class="brand">Legal Pad <span class="small">/ Mis notas</span></strong><div class="topright"><span class="small" id="userlabel"></span><button id="signout">Salir</button></div></header><div class="app"><aside class="sidebar"><div class="sidebarhead"><strong>Mis notas</strong><button id="newnote">+ Nueva</button></div><nav id="notelist" class="notelist" aria-label="Notas"></nav></aside><main class="pad"><div class="lines"></div><div class="heading"><input id="title" maxlength="120" aria-label="Título" placeholder="Sin título"><button id="download" title="Exportar texto">TXT</button><button id="delete" title="Eliminar nota">Eliminar</button></div><nav id="toc" class="toc" aria-label="Índice de esta nota"></nav><div class="hintedit"><button id="insertheading" class="insertheading" type="button">+ Encabezado H1</button> &nbsp; o escribe <code># Título</code> al inicio de una línea.</div><textarea id="body" aria-label="Contenido" placeholder="Empieza a escribir aquí..."></textarea></main></div><footer class="foot"><span id="status" role="status">Conectando…</span><span>Firebase Cloud Sync</span></footer><button id="backtop" class="backtop hidden" type="button" title="Volver al principio de la nota" aria-label="Volver al principio">↑ Arriba</button></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,addDoc,setDoc,deleteDoc,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const $=id=>document.getElementById(id),login=$('login'),workspace=$('workspace'),status=$('status'),title=$('title'),body=$('body');
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore();
let user=null,notes=[],selected=null,unsubscribe=null,timer=null,dirty=false,pending=Promise.resolve(),generation=0;
$('signin').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('loginmsg').textContent='No fue posible iniciar sesión: '+e.message}};
onAuthStateChanged(auth,u=>{generation++;clearTimeout(timer);if(unsubscribe)unsubscribe();unsubscribe=null;user=u;notes=[];selected=null;dirty=false;title.value='';body.value='';refreshPage();login.classList.toggle('hidden',!!u);workspace.classList.toggle('hidden',!u);if(!u)return;$('userlabel').textContent=u.displayName||u.email||'';status.textContent='Sincronizando…';const token=generation;unsubscribe=onSnapshot(collection(db,'users',u.uid,'notes'),snap=>{if(token!==generation)return;notes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));if(selected&&!notes.some(n=>n.id===selected)){selected=null;title.value='';body.value='';dirty=false;refreshPage()}if(!selected&&notes.length){selected=notes[0].id;populate()}render();if(!dirty)status.textContent='Sincronizado';},e=>status.textContent='Error de sincronización: '+e.message)});
function render(){const n=$('notelist');n.replaceChildren();for(const item of notes){let b=document.createElement('button');b.className='noteitem'+(selected===item.id?' active':'');b.textContent=item.title?.trim()||'Sin título';b.onclick=()=>choose(item.id);n.append(b)}}
function populate(){const n=notes.find(x=>x.id===selected);if(n){title.value=n.title||'';body.value=n.body||''}refreshPage();render()}
async function persist(){clearTimeout(timer);if(!dirty||!selected||!user)return;const uid=user.uid,id=selected,value={title:title.value,body:body.value,updatedAt:serverTimestamp()},token=generation;dirty=false;status.textContent='Guardando…';pending=pending.catch(()=>{}).then(()=>setDoc(doc(db,'users',uid,'notes',id),value,{merge:true}));try{await pending;if(token===generation)status.textContent=dirty?'Cambios pendientes':'Guardado en la nube'}catch(e){if(token===generation){dirty=true;status.textContent='Error al guardar: '+e.message}}}
function changed(){if(!user||!selected)return;dirty=true;status.textContent='Cambios pendientes…';clearTimeout(timer);timer=setTimeout(persist,900);const n=notes.find(x=>x.id===selected);if(n)n.title=title.value;render()}
title.oninput=changed;body.oninput=()=>{changed();refreshPage()};
function resizePage(){body.style.height='auto';body.style.height=Math.max(window.innerHeight*0.55,body.scrollHeight+2)+'px'}
function headings(){const found=[];let offset=0;for(const line of body.value.split('\n')){const m=/^#\s+(.+?)\s*$/.exec(line);if(m)found.push({name:m[1],index:offset});offset+=line.length+1}return found}
function jumpTo(index){const before=body.value.slice(0,index),measure=document.createElement('div'),cs=getComputedStyle(body);Object.assign(measure.style,{position:'absolute',visibility:'hidden',pointerEvents:'none',top:'0',left:'-99999px',width:cs.width,boxSizing:'border-box',padding:cs.padding,font:cs.font,lineHeight:cs.lineHeight,letterSpacing:cs.letterSpacing,whiteSpace:'pre-wrap',overflowWrap:'break-word',wordBreak:'break-word'});measure.textContent=before+'\u200b';document.body.append(measure);const y=measure.getBoundingClientRect().height-parseFloat(cs.paddingBottom)-parseFloat(cs.lineHeight);measure.remove();const top=window.scrollY+body.getBoundingClientRect().top+Math.max(0,y)-20;window.scrollTo({top,behavior:'smooth'})}
function refreshPage(){resizePage();const nav=$('toc');nav.replaceChildren();const items=headings();if(items.length){const label=document.createElement('span');label.className='toc-label';label.textContent='ÍNDICE';nav.append(label)}for(const item of items){const link=document.createElement('a');link.href='#';link.textContent=item.name;link.addEventListener('click',e=>{e.preventDefault();jumpTo(item.index)});nav.append(link)}}
$('insertheading').onclick=()=>{if(!selected)return;const start=body.selectionStart,end=body.selectionEnd,text=body.value;const lineStart=text.lastIndexOf('\n',start-1)+1;const prefix=lineStart===0?'':'\n';const insert=prefix+'# Nuevo encabezado\n';body.setRangeText(insert,start,end,'end');body.focus();changed();refreshPage()};
$('backtop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
function toggleTop(){ $('backtop').classList.toggle('hidden',!user||window.scrollY<220)}
window.addEventListener('scroll',toggleTop,{passive:true});
window.addEventListener('resize',resizePage);
async function choose(id){if(id===selected)return;await persist();selected=id;populate()}
$('newnote').onclick=async()=>{if(!user)return;await persist();try{const d=await addDoc(collection(db,'users',user.uid,'notes'),{title:'',body:'',updatedAt:serverTimestamp()});selected=d.id;title.value='';body.value='';refreshPage();render();body.focus();status.textContent='Nota creada'}catch(e){status.textContent='Error al crear: '+e.message}};
$('delete').onclick=async()=>{if(!user||!selected||!confirm('¿Eliminar la nota de todos los dispositivos?'))return;await persist();const id=selected;try{await pending;await deleteDoc(doc(db,'users',user.uid,'notes',id));selected=null;title.value='';body.value='';refreshPage();status.textContent='Nota eliminada'}catch(e){status.textContent='Error al eliminar: '+e.message}};
$('download').onclick=()=>{const name=(title.value.trim()||'mi-nota').replace(/[\\/:*?"<>|]/g,'').slice(0,70)||'mi-nota';const value=(title.value.trim()?title.value.trim()+'\n\n':'')+body.value;const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('signout').onclick=async()=>{await persist();await signOut(auth)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist()});
</script></body></html>
